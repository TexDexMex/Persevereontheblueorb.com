<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Persevere on the Blue Orb</title>
<meta name="description" content="Persevere on the Blue Orb — coming soon.">
<style>
  :root { --bg:#f6f8fb; --fg:#14213d; --muted:#5b6b85; --orb1:#7cc4ff; --orb2:#1d4ed8; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0b1220; --fg:#e6edf7; --muted:#93a3bd; --orb1:#5fb2ff; --orb2:#1e3a8a; } }
  * { box-sizing:border-box; margin:0; }
  body { min-height:100vh; display:grid; place-items:center; padding:24px 16px;
         background:var(--bg); color:var(--fg);
         font:16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align:center; }
  .orb { width:120px; height:120px; margin:0 auto 28px; border-radius:50%;
         background:radial-gradient(circle at 32% 30%, #fff 0 6%, var(--orb1) 22%, var(--orb2) 78%);
         box-shadow:0 18px 50px -12px rgba(29,78,216,.55); }
  h1 { font-size:clamp(1.6rem, 5vw, 2.4rem); letter-spacing:-.02em; }
  p { color:var(--muted); margin-top:8px; }
</style>
</head>
<body>
  <main>
    <div class="orb" aria-hidden="true"></div>
    <h1>Persevere on the Blue Orb</h1>
    <p>Coming soon.</p>
  </main>
</body>
</html>
